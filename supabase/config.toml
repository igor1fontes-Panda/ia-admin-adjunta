# Supabase CLI configuration — https://supabase.com/docs/guides/local-development/cli/config
# Local-dev defaults only; linking to the hosted project happens via
#   npx supabase link --project-ref aebdqztoolszdzfbdlbp
project_id = "fontes-ai-admin-adjunta"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://project-orgt3.vercel.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"
