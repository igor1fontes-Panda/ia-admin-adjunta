name: Internal preview environment controller
description: >
  Local, dependency-free implementation of the Cloud Posse preview
  environment controller. Upstream provenance:
  cloudposse/github-action-preview-environment-controller
  commit f45303de8d8f6f29895ffb87332468c48b05592b.

inputs:
  env-label:
    description: YAML map of environment names to required PR labels.
    required: true
  labels:
    description: JSON array of labels currently present on the PR.
    required: true
  open:
    description: Whether the pull request is open.
    required: true

outputs:
  labels_env:
    description: JSON map of labels to environment names.
    value: ${{ steps.calculate.outputs.labels_env }}
  deploy_envs:
    description: JSON array of environments to deploy.
    value: ${{ steps.calculate.outputs.deploy_envs }}
  destroy_envs:
    description: JSON array of environments to destroy.
    value: ${{ steps.calculate.outputs.destroy_envs }}

runs:
  using: composite
  steps:
    - id: calculate
      shell: bash
      env:
        ENV_LABEL: ${{ inputs.env-label }}
        PR_LABELS: ${{ inputs.labels }}
        PR_OPEN: ${{ inputs.open }}
      run: |
        set -euo pipefail
        ruby <<'RUBY'
        require 'yaml'
        require 'json'

        env_map = YAML.safe_load(ENV.fetch('ENV_LABEL'), permitted_classes: [], aliases: false)
        labels = JSON.parse(ENV.fetch('PR_LABELS'))
        raise 'env-label must be a YAML mapping' unless env_map.is_a?(Hash)
        raise 'labels must be a JSON array of strings' unless labels.is_a?(Array) && labels.all? { |v| v.is_a?(String) }
        raise 'open must be true or false' unless %w[true false].include?(ENV.fetch('PR_OPEN'))

        labels_env = {}
        deploy = []
        destroy = []
        env_map.each do |environment, required_label|
          raise 'environment names and labels must be strings' unless environment.is_a?(String) && required_label.is_a?(String)
          labels_env[required_label] = environment
          if ENV.fetch('PR_OPEN') == 'true' && labels.include?(required_label)
            deploy << environment
          else
            destroy << environment
          end
        end

        File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
          output.puts "labels_env=#{JSON.generate(labels_env)}"
          output.puts "deploy_envs=#{JSON.generate(deploy)}"
          output.puts "destroy_envs=#{JSON.generate(destroy)}"
        end
        RUBY
