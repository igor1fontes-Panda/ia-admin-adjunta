name: Format Supabase smoke PR files

on:
  push:
    branches:
      - test/supabase-bot-compat-20261127

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/supabase-bot-compat-20261127
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the files in this PR
        run: |
          npx prettier --write \
            scripts/neon-read-replica-smoke.mjs \
            scripts/supabase-legacy-bot-smoke.mjs \
            docs/security/SUPABASE_LEGACY_BOT_COMPATIBILITY_TEST.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/neon-read-replica-smoke.mjs scripts/supabase-legacy-bot-smoke.mjs docs/security/SUPABASE_LEGACY_BOT_COMPATIBILITY_TEST.md
          git commit -m "style: format Supabase compatibility smoke files"
          git push
