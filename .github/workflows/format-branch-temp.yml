name: Temporary branch formatter
on:
  push:
    branches:
      - "fix/supabase-neon-drift-2026-11-21"
    paths:
      - ".github/workflows/format-branch-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/supabase-neon-drift-2026-11-21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed JavaScript files
        run: npx prettier --write scripts/bot-lib.mjs scripts/error-handler.mjs
      - name: Commit formatting to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/bot-lib.mjs scripts/error-handler.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format Neon adapter and delivery QA"
            git push origin HEAD:fix/supabase-neon-drift-2026-11-21
          fi
