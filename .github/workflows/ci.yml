name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Python bots syntax and offline tests
        run: |
          python3 -m py_compile ai_engine.py scripts/hume_voice.py
          python3 -m unittest -v test_ai_engine.py
          echo "Python bots compile and offline tests pass"

      - name: Python bots logic tests (no live account)
        run: |
          python3 -m unittest discover -s tests -v
          echo "✅ Python bot logic verified with fake transports"

      - name: Python dependency audit
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt
          echo "✅ Python dependencies clean"

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Formatting check (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage gate (vitest thresholds fail below 50% lines)
        run: npm run coverage

      - name: Build
        run: npm run build
        env:
          # Build works with or without live keys
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MOCK_DATA: "true"

      - name: Check client bundle for server secrets
        run: |
          if grep -RInE 'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|GEMINI_API_KEY|BLACKBOX_API_KEY' src public 2>/dev/null; then
            echo "Server-only secret name found in client-facing source."
            exit 1
          fi

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo "- Commit: `${GITHUB_SHA:0:12}`"
            echo "- Node: `$(node --version)`"
            echo "- npm: `$(npm --version)`"
            echo "- Result: `${{ job.status }}`"
          } >> "$GITHUB_STEP_SUMMARY"

  fresh-clone-smoke:
    # Proves a clean machine can install, build and test with ZERO manual
    # setup and no live Supabase/Neon/Gemini credentials (mock data on).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build with mock data (no credentials)
        run: npm run build
        env:
          VITE_MOCK_DATA: "true"

      - name: Unit tests (no credentials)
        run: npm test
        env:
          VITE_MOCK_DATA: "true"

      - name: Smoke summary
        if: always()
        run: |
          {
            echo "## Fresh-clone smoke"
            echo "- Commit: `${GITHUB_SHA:0:12}`"
            echo "- Result: `${{ job.status }}` — npm ci && VITE_MOCK_DATA=true npm run build && npm test passed without any secrets"
          } >> "$GITHUB_STEP_SUMMARY"
