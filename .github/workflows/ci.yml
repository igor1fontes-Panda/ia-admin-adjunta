name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Python bots syntax and offline tests
        run: |
          python3 -m py_compile ai_engine.py scripts/hume_voice.py
          python3 -m unittest -v test_ai_engine.py
          echo "Python bots compile and offline tests pass"

      - name: Python bots logic tests (no live account)
        run: |
          python3 -m unittest discover -s tests -v
          echo "✅ Python bot logic verified with fake transports"

      - name: Python dependency audit
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt
          echo "✅ Python dependencies clean"

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Formatting check (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage gate (vitest thresholds fail below 50% lines)
        run: npm run coverage

      - name: Build
        run: npm run build
        env:
          # Build works with or without live keys
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MOCK_DATA: "true"

      - name: Check built client bundle for server secrets
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";

          const root = "dist";
          const serverOnlyNames = [
            "SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_SECRET_KEY",
            "SUPABASE_JWT_SECRET",
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "GEMINI_API_KEY",
            "BLACKBOX_API_KEY",
            "HUME_API_KEY",
          ];
          const tokenPatterns = [
            ["Supabase secret API key", /sb_secret_[A-Za-z0-9_-]{12,}/g],
            ["Stripe secret API key", /sk_(?:live|test)_[A-Za-z0-9]{12,}/g],
            ["Stripe webhook signing secret", /whsec_[A-Za-z0-9]{12,}/g],
            ["private key material", /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/g],
            ["Postgres connection URI", /postgres(?:ql)?:\\/\\/[^:\\s/@]+:[^@\\s/]+@[^/\\s]+\\/[^\\s]+/g],
          ];
          const files = [];
          async function walk(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) await walk(file);
              else files.push(file);
            }
          }
          await walk(root);
          if (files.length === 0) throw new Error("The built dist bundle is empty.");

          const findings = [];
          for (const file of files) {
            const content = await readFile(file, "utf8");
            for (const name of serverOnlyNames) {
              if (content.includes(name)) findings.push({ file, label: `server-only variable name: ${name}` });
            }
            for (const [label, pattern] of tokenPatterns) {
              if (pattern.test(content)) findings.push({ file, label });
              pattern.lastIndex = 0;
            }
            for (const match of content.matchAll(/eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+/g)) {
              try {
                const payload = JSON.parse(Buffer.from(match[1], "base64url").toString("utf8"));
                if (payload.role === "service_role") findings.push({ file, label: "Supabase service_role JWT" });
              } catch {
                // Ignore non-JWT strings that only resemble a compact token.
              }
            }
          }
          if (findings.length) {
            for (const finding of findings) console.error(`BLOCKED ${finding.file}: ${finding.label}`);
            process.exit(1);
          }
          console.log(`Scanned ${files.length} built files: no known server-only secret names or token formats found.`);
          NODE

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo "- Commit: ${GITHUB_SHA:0:12}"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  fresh-clone-smoke:
    # Proves a clean machine can install, build and test with ZERO manual
    # setup and no live Supabase/Neon/Gemini credentials (mock data on).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build with mock data (no credentials)
        run: npm run build
        env:
          VITE_MOCK_DATA: "true"

      - name: Unit tests (no credentials)
        run: npm test
        env:
          VITE_MOCK_DATA: "true"

      - name: Smoke summary
        if: always()
        run: |
          {
            echo "## Fresh-clone smoke"
            echo "- Commit: ${GITHUB_SHA:0:12}"
            echo "- Result: ${{ job.status }} — npm ci && VITE_MOCK_DATA=true npm run build && npm test passed without any secrets"
          } >> "$GITHUB_STEP_SUMMARY"
