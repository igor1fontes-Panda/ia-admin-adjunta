name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Python bots syntax check
        run: |
          python3 -m py_compile ai_engine.py scripts/hume_voice.py
          echo "✅ Python bots compile"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build works with or without live keys
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo "- Commit: `${GITHUB_SHA:0:12}`"
            echo "- Node: `$(node --version)`"
            echo "- npm: `$(npm --version)`"
            echo "- Result: `${{ job.status }}`"
          } >> "$GITHUB_STEP_SUMMARY"
