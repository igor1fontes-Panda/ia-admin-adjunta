name: Supabase Migrations

# Applies supabase/migrations/*.sql to the production database on every
# merge to main that touches them (link → dry-run → db push).
#
# Requires ONE repo secret (GitHub → Settings → Secrets and variables → Actions;
# the Freebuff credential cannot manage repo secrets):
#   SUPABASE_ACCESS_TOKEN   — Supabase → Account → Access Tokens
# Optional:
#   SUPABASE_DB_PASSWORD    — only if db push ever asks for the database password
#                             (Project Settings → Database). Recent CLI versions
#                             provision a temporary login role from the token instead.
#
# Without the secret the job skips cleanly with a notice (same pattern as deploy.yml).
# Migrations must be idempotent-ish and append-only: never edit a migration that
# already ran on the remote — add a new one with `supabase migration new <name>`.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for Supabase credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Supabase access token present — pushing migrations."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase db push skipped — add repo secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens) to enable automatic migrations on merge to main."
          fi

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install deps (supabase CLI is a devDependency)
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Link project
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Override per-environment via repo variable SUPABASE_PROJECT_ID.
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'aebdqztoolszdzfbdlbp' }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations (dry run)
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --dry-run

      - name: Push migrations to the remote database
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push

      - name: Verify migration history in sync
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase migration list
