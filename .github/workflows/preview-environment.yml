name: Preview environment controller

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: write

concurrency:
  group: preview-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Manage preview environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preview environment controller
        uses: ./.github/actions/preview-environment-controller
        with:
          env-label: |
            preview: deploy
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          open: ${{ github.event.action != 'closed' }}
