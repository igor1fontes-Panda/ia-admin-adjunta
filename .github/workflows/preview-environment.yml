name: Preview environment controller

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: write

concurrency:
  group: preview-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Manage preview environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compute preview environment outputs
        id: controller
        shell: bash
        run: |
          # The previous controller received labels: "[]" and its outputs
          # were not consumed by any other job. Preserve those exact results
          # without downloading unpinned third-party composite actions.
          echo 'labels_env={"deploy":"preview"}' >> "$GITHUB_OUTPUT"
          echo 'deploy_envs=[]' >> "$GITHUB_OUTPUT"
          echo 'destroy_envs=[]' >> "$GITHUB_OUTPUT"
