name: Deploy Status

# Post-deploy health verification. Checks the live Vercel production URL.
#
# Handles Vercel "Deployment Protection" (SSO): when enabled, unauthenticated
# requests get a 302 redirect to vercel.com/login. That is NOT a broken build —
# so we treat "reachable + redirect to Vercel login" as alive, and only fail on
# 5xx errors from the app itself or a missing root element on a direct 200.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * 6" # every 6 hours
  workflow_run:
    workflows: ["Deploy to Vercel"]
    types: [completed]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health-check site
        run: |
          SITE_URL="https://project-orgt3.vercel.app"
          echo "Checking $SITE_URL ..."
          code=$(curl -s -o /tmp/site.html -w "%{http_code}" --max-time 20 "$SITE_URL")
          echo "GET $SITE_URL → HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "::error::Site is returning server errors (HTTP $code)"
            exit 1
          fi
          if [ "$code" -eq 000 ]; then
            echo "::error::Site unreachable (connection failure)"
            exit 1
          fi
          if [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then
            # Redirect (typically Vercel Deployment Protection → SSO login).
            # Site is alive; the SPA itself cannot be inspected unauthenticated.
            echo "✅ Site alive (HTTP $code redirect — likely Vercel Deployment Protection)"
            exit 0
          fi
          # Direct 200: verify the SPA bundle really loads
          bundle_check=$(grep -c 'id="root"' /tmp/site.html || true)
          if [ "$bundle_check" -eq 0 ]; then
            echo "::error::SPA root element missing — build may be broken"
            exit 1
          fi
          echo "✅ Site healthy (HTTP $code, SPA root present)"
