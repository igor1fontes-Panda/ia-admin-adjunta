name: Autonomous AI Bots

# The ecosystem's autonomy layer — REAL DATA ONLY:
#  - lead qualifier: scores real inbound leads daily (Gemini Interactions API)
#  - error handler: triages real incidents hourly
#  - insight engine: daily data-grounded growth insight (Python GenAI SDK)
on:
  schedule:
    - cron: "0 6 * * *"      # lead qualifier + insight — daily 06:00 UTC
    - cron: "0 * * * *"      # error handler — hourly
  workflow_dispatch:
    inputs:
      bot:
        description: "Which bot to run"
        type: choice
        options: [lead-hunter, error-handler, insight, all]
        default: all

concurrency:
  group: ai-bots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lead-hunter:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.bot == 'lead-hunter' || inputs.bot == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Qualify real leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLACKBOX_API_KEY: ${{ secrets.BLACKBOX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEAD_BOT_MIN_SCORE: "70"
        run: node scripts/lead-hunter.mjs

  error-handler:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 * * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.bot == 'error-handler' || inputs.bot == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Triage real incidents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLACKBOX_API_KEY: ${{ secrets.BLACKBOX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/error-handler.mjs

  insight:
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' ||
      github.event_name == 'workflow_dispatch' && (inputs.bot == 'insight' || inputs.bot == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate daily insight from real data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLACKBOX_API_KEY: ${{ secrets.BLACKBOX_API_KEY }}
          HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ai_engine.py
