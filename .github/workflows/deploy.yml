name: Deploy to Vercel

# OPTIONAL CI-driven deployment. The primary production path is Vercel's
# native GitHub integration (push to main → Vercel builds). This workflow is
# for teams that prefer GitHub Actions to own the deploy step.
#
# It skips cleanly (no failure) until these repo SECRETS exist:
#   VERCEL_TOKEN        — Vercel → Settings → Tokens
#   VERCEL_ORG_ID       — .vercel/project.json → orgId (or Vercel dashboard)
#   VERCEL_PROJECT_ID   — .vercel/project.json → projectId
#
# When they exist, every push to main deploys production from CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials present — deploying."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deploy skipped — add repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to enable. (Vercel's native GitHub integration may already be deploying your pushes.)"
          fi

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Pull Vercel environment (production)
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build (prebuilt output)
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
