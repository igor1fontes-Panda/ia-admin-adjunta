name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; new pushes cancel older queued deploys.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Hosting installs with production semantics; build-time tools live in
      # dependencies (see package.json), so this is sufficient for vite build.
      - name: Install
        run: npm ci --include=dev

      - name: Build
        run: node node_modules/vite/bin/vite.js build

      - name: Deploy to Vercel
        # Skips cleanly until Vercel is connected (secrets set); activates
        # automatically the moment they exist. No red noise on main.
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npx --yes vercel@latest deploy dist --prebuilt --prod \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes

      - name: Vercel not configured — setup required
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "Vercel secrets not set — skipping (primary host remains Freebuff)."
          echo "To enable automatic Vercel deploys:"
          echo "  1. Import the repo at https://vercel.com/import (preset: Vite, output: dist)"
          echo "  2. Add GitHub repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
